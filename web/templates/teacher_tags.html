<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Synapse Cycle — Review Concept Tags</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    .card { background: #1e293b; border-radius: 8px; padding: 2rem; max-width: 650px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
    h1 { margin-top: 0; color: #38bdf8; }
    .concept-item { background: #334155; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; }
    label { display: block; margin-top: 0.5rem; font-weight: 600; font-size: 0.875rem; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-top: 0.25rem; }
    button { background: #2563eb; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 1rem; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Teacher Concept Tag Confirmation</h1>
    <p>Please review and confirm the concepts extracted from your canonical notes.</p>
    <form method="POST" action="/web/teacher/tags/{{ run_id }}">
      {% for concept in concepts %}
      <div class="concept-item">
        <label>Concept Name</label>
        <input type="text" name="concept_name_{{ loop.index0 }}" value="{{ concept.name }}" required />
        <label>Summary</label>
        <textarea name="concept_summary_{{ loop.index0 }}" rows="2" required>{{ concept.summary }}</textarea>
      </div>
      {% endfor %}
      <button type="submit">Confirm &amp; Generate Diagnostic Test</button>
    </form>
  </div>
</body>
</html>
